# Replace `myapp` with your top-level package, then drop this at the repo root
# as `.importlinter` (no extension). The audit skill auto-detects it.

[importlinter]
root_package = myapp
include_external_packages = True

[importlinter:contract:layers]
name = Application layered architecture
type = layers
layers =
    myapp.interface
    myapp.application
    myapp.domain
    myapp.infrastructure

[importlinter:contract:forbidden]
name = Production code must not import from tests
type = forbidden
source_modules = myapp
forbidden_modules = tests
