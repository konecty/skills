# Copy the relevant blocks into the target repo's pyproject.toml.

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations", "build", "dist", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
fixable = ["ALL"]
ignore = ["E501"]

[tool.deptry]
exclude = ["tests", "build", "dist", "venv", ".venv"]
known_first_party = []

[tool.vulture]
min_confidence = 80
exclude = ["tests/", "migrations/", "*/migrations/*"]
ignore_decorators = [
    "@app.route",
    "@blueprint.route",
    "@router.*",
    "@receiver",
    "@shared_task",
    "@task",
    "@app.task",
    "@pytest.fixture",
    "@hookimpl",
    "@click.command",
    "@click.group",
    "@cli.command",
]

[tool.pylint.similarities]
min-similarity-lines = 6
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
