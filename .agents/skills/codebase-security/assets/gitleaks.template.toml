# .gitleaks.toml — allowlist template for codebase-security audits.
# Copy to the repo root as `.gitleaks.toml`; gitleaks loads it automatically.
#
# Prefer FINGERPRINT allowlists (one specific finding) over path allowlists
# (a whole file, forever). Get the fingerprint from `gitleaks ... -v` output.

[extend]
# Keep all default rules; this file only ADDS allowlist entries.
useDefault = true

[allowlist]
description = "Project-specific false positives — every entry needs a justification comment"

# Documentation that demonstrates URL formats with dummy credentials.
paths = [
  # '''docs/examples\.md''',          # example: connection-string docs, dummy creds only
]

# Specific reviewed findings (rule:file:line fingerprints).
# fingerprints = [
#   "deadbeef...:config/sample.py:generic-api-key:12",  # reviewed 2026-06-11: test fixture, key revoked
# ]

# Regexes for values that are provably not credentials in this repo.
regexes = [
  # '''localhost:[0-9]+''',
]
