[pytest]
testpaths = tests
markers =
    live: tests that require a live Konecty stack at E2E_KONECTY_URL (skipped if unreachable)
    mock: tests that run skill scripts against the in-memory MockKonecty (no stack needed)
    integration: legacy integration tests requiring a pre-existing Konecty + ~/.konecty/.env
addopts = -ra
