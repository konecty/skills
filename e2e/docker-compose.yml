name: konecty-skills-e2e

# Isolated, disposable Konecty stack for the MCP-first skills e2e harness.
# The Konecty image is BUILT FROM SOURCE out of the local git worktree at
# e2e/.konecty-src (branch feat/oauth-admin-scope-trusted-clients — the
# admin-OAuth feature, konecty/Konecty#453). `make e2e-src` creates/refreshes
# the worktree and builds dist/ (the repo's Dockerfile copies a prebuilt dist).
#
#   make e2e-up      # build + boot + wait + MCP namespace bootstrap
#   make e2e-reset   # down -v (clean DB + fresh admin password next boot)
#
# Runs on ALTERNATE ports (:3200) so it can coexist with a dev Konecty on :3000.

services:
  mongodb:
    image: mongo:8.2
    container_name: konecty-e2e-mongodb
    restart: unless-stopped
    command: mongod --bind_ip_all --replSet rs0
    volumes:
      - mongodb-data:/data/db
    ports:
      - "${E2E_MONGO_PORT:-27117}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [e2e-network]

  mongodb-init:
    image: mongo:8.2
    container_name: konecty-e2e-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - |
        until mongosh --host mongodb:27017 --eval 'db.adminCommand("ping")' >/dev/null 2>&1; do sleep 2; done;
        if ! mongosh --host mongodb:27017 --eval 'rs.status()' 2>/dev/null | grep -q 'set: .rs0.'; then
          echo 'Initiating replica set';
          mongosh --host mongodb:27017 --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]})';
        else
          echo 'Replica set already initialized';
        fi
    networks: [e2e-network]

  rabbitmq:
    image: rabbitmq:4.1.0-management-alpine
    container_name: konecty-e2e-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:-admin}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [e2e-network]

  konecty:
    build:
      # Local Konecty worktree (feat/oauth-admin-scope-trusted-clients) with a
      # prebuilt dist/ — see `make e2e-src`. Uses the repo's own Dockerfile.
      context: .konecty-src
      dockerfile: Dockerfile
    image: konecty-e2e-local:mcp-first
    container_name: konecty-e2e-konecty
    restart: unless-stopped
    depends_on:
      mongodb-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    environment:
      - PORT=3000
      - KONECTY_MODE=development
      # NODE_ENV=production makes the built image resolve metadata at
      # /app/private/metadata (the shipped seed docs); dev mode looks for a
      # src/ path that doesn't exist in the compiled image.
      - NODE_ENV=production
      - COOKIES_SECRET=${E2E_COOKIES_SECRET:-e2e-cookies-secret-not-for-production}
      - KONMETA_NAMESPACE=${E2E_NAMESPACE:-e2e}
      - MONGO_URL=mongodb://mongodb:27017/${E2E_NAMESPACE:-e2e}?directConnection=true
      # ── Public URLs (host perspective) — issuer and audience MUST be
      #    consistent: PLATFORM_MCP_RESOURCE_URL is what /mcp validates OAuth
      #    token audiences against and what the well-known endpoint announces.
      - KONECTY_URL=${E2E_PUBLIC_URL:-http://localhost:3200}
      - OAUTH_ISSUER_URL=${E2E_PUBLIC_URL:-http://localhost:3200}
      - PLATFORM_MCP_RESOURCE_URL=${E2E_PUBLIC_URL:-http://localhost:3200}/mcp
      - HUB_MCP_RESOURCE_URL=${E2E_PUBLIC_URL:-http://localhost:3200}/mcp
      # ── OAuth clients seed. REPLACES the default seeded clients entirely
      #    (docs/en/mcp.md caveat). Two clients:
      #    * e2e-user  — normal (untrusted) client: read/write only, mirrors a
      #      DCR-registered client but with a stable id for the suites.
      #    * e2e-admin — trusted first-party client allowed to request `admin`
      #      (ADR-0011 recipe). Fixed localhost callback; redirect URIs are
      #      matched exactly and no listener is needed: the consent decision
      #      API returns the redirect URL as JSON.
      - >-
        OAUTH_CLIENTS_JSON=[
        {"clientId":"e2e-user","name":"E2E User Client",
        "redirectUris":["http://localhost:19818/callback"],
        "allowedScopes":["read","write"],
        "allowedAudiences":["${E2E_PUBLIC_URL:-http://localhost:3200}/mcp"],
        "publicClient":true},
        {"clientId":"e2e-admin","name":"E2E Trusted Admin Client",
        "redirectUris":["http://localhost:19819/callback"],
        "allowedScopes":["read","write","admin"],
        "allowedAudiences":["${E2E_PUBLIC_URL:-http://localhost:3200}/mcp"],
        "publicClient":true,"trustedFirstParty":true}
        ]
      - DISABLE_REINDEX=true
      - DISABLE_TELEMETRY_LOGS=true
      - DISABLE_SENDMAIL=true
      - OTP_EMAIL_ENABLED=true
      - DEFAULT_LOCALE=pt_BR
      - LOG_LEVEL=info
      - ALLOWED_ORIGINS=http://localhost:3200|http://localhost:5173
      - UI_PROXY=false
      - BODY_LIMIT=10485760
    ports:
      - "${E2E_KONECTY_PORT:-3200}:3000"
    healthcheck:
      # the konecty image ships wget (no curl); 127.0.0.1 avoids IPv6 ::1
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/liveness"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [e2e-network]

volumes:
  mongodb-data:
  rabbitmq-data:

networks:
  e2e-network:
    driver: bridge
