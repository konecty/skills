[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "konecty-skills"
version = "0.1.0"
description = "One-command installer for Konecty Agent Skills (konecty-data, konecty-meta)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Konecty" }]
keywords = ["konecty", "agent-skills", "installer", "claude-code", "cursor"]
# Runtime is stdlib only (NFR1) — no dependencies on purpose.
dependencies = []

[project.urls]
Homepage = "https://github.com/konecty/skills"
Repository = "https://github.com/konecty/skills"

[project.scripts]
konecty-skills = "konecty_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/konecty_skills"]
