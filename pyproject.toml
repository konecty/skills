[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Root packaging on purpose: `uvx --from git+https://github.com/konecty/skills konecty-skills`
# resolves the repo root, so the pyproject must live here. The package source stays
# under installer/src (see docs/changelog/2026-07-14_uvx-root-packaging.md).

[project]
name = "konecty-skills"
version = "0.1.1"
description = "One-command installer for Konecty Agent Skills (konecty-data, konecty-meta, konecty-setup, konecty-dev)."
readme = "installer/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Konecty" }]
keywords = ["konecty", "agent-skills", "installer", "claude-code", "cursor", "mcp"]
# Runtime is stdlib only (NFR1) — no dependencies on purpose.
dependencies = []

[project.urls]
Homepage = "https://github.com/konecty/skills"
Repository = "https://github.com/konecty/skills"

[project.scripts]
konecty-skills = "konecty_skills.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["installer/src/konecty_skills"]
